</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),H=.866,app=$("#app");
const COL=["#D9650F","#1F8A7D","#6C4FA3","#D4503A","#2F6FD6"];
function sg(k,n){const s=new Set,ad=(a,b)=>{if(a[0]>b[0]||(a[0]==b[0]&&a[1]>b[1]))[a,b]=[b,a];s.add([a,b].map(p=>p.map(v=>+v.toFixed(3))).join("|"))};
for(let i=0;i<n;i++){if(k=="t"){const x=i/2,u=i%2==0,A=[x,u?0:H],B=[x+1,u?0:H],C=[x+.5,u?H:0];ad(A,B);ad(A,C);ad(B,C)}else{ad([i,0],[i+1,0]);ad([i,1],[i+1,1]);ad([i,0],[i,1]);ad([i+1,0],[i+1,1])}}return[...s]}
/* o.nw: highlight new sticks; o.pl: place mode (Set of placed keys) */
function fig(k,n,o={}){const u=40,cur=sg(k,n),pv=o.nw&&n>1?sg(k,n-1):[],w=(k=="t"?n/2+.5:n)*u+16,h=(k=="t"?H:1)*u+16;let s="";
cur.forEach(e=>{const[a,b]=e.split("|").map(p=>p.split(",").map(Number)),X=p=>p[0]*u+8,Y=p=>h-8-p[1]*u,L=`x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"`;
if(o.pl){const on=o.pl.has(e);s+=`<line ${L} stroke="${on?"#D9A55B":"#c5d0d8"}" stroke-width="${on?7:5}" stroke-linecap="round" ${on?"":'stroke-dasharray="3 9"'}/>${on?`<circle cx="${X(a)}" cy="${Y(a)}" r="4.5" fill="#C0392B"/>`:""}<line class="sl" data-k="${e}" ${L} stroke="transparent" stroke-width="22"/>`}
else{const nu=o.nw&&!pv.includes(e);s+=`<line ${L} stroke="${nu?"#E8751A":"#D9A55B"}" stroke-width="7" stroke-linecap="round"/><circle cx="${X(a)}" cy="${Y(a)}" r="4.5" fill="#C0392B"/>`}});
return`<div style="display:inline-block;text-align:center;margin:4px 8px"><svg viewBox="0 0 ${w} ${h}" style="width:${Math.round(w*(o.pl?2.5:1.3))}px;max-width:100%;height:auto">${s}</svg><div><b>${o.lab||"Figure "+n}</b>${o.c!=null?" = <b style='color:#E8751A'>"+o.c+"</b>":""}</div></div>`}
const chairs=r=>Array.from({length:r},(_,i)=>{const c=2*i+5;return`<div style="margin:3px 0"><b style="display:inline-block;width:62px">Row ${i+1}</b>${'<i style="display:inline-block;width:16px;height:15px;border-radius:4px;background:#2A8C8C;margin:1px"></i>'.repeat(c)} <b>${c}</b></div>`}).join("");
/* ---------- pages ---------- */
const OBJ=["identify the regularity (the rule of change) in a pattern of arranged objects;","determine the number of objects in the next figures by continuing the pattern;","generalize the pattern into a formula for the n-th figure (Uₙ) and use it to find any figure, such as the 10th or the 100th."];
const KW=[["pattern","a group of objects or numbers that follows a rule"],["figure","one picture in the pattern"],["next","the one that comes after"],["add","to make more"],["difference","how much more we get each time"],["rule","what the pattern does each time"],["formula","a rule that uses n to find any figure"],["term","one number in a sequence"]];
const tb=(t,back)=>`<div class="top">${back?`<a href="#/${back}">← ${back=="menu"?"Menu":"Back"}</a>`:""}<b>${t}</b></div>`;
const IC={objectives:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>',materials:'<svg viewBox="0 0 24 24"><path d="M5 4.5h9.5A3.5 3.5 0 0 1 18 8v11.5H8.5A3.5 3.5 0 0 1 5 16z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H18"/></svg>',worksheet:'<svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4M9.5 12h5M9.5 15.5h5"/></svg>',game:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg>'};
const P={
home:()=>`<div class="hero"><i class="ms m1"></i><i class="ms m2"></i><i class="ms m3"></i><div class="hin"><div><h1>Pattern<br><span>Detective HQ</span></h1><p>Number Patterns • Grade 8 Mathematics</p><a class="btn" href="#/menu">Start the case</a></div><div class="ev"><div class="evh">Case file</div>${fig("t",3,{lab:"Figure 3"})}<p class="evq">How many matchsticks for <b>Figure 100</b>?</p></div></div></div>`,
menu:()=>tb("Pattern Detective HQ")+`<div class="wrap"><h2>Menu</h2><div class="grid mn">${[["objectives","Learning Objectives","What you will learn today.",0],["materials","Materials","Patterns, differences, and the formula Uₙ.",1],["worksheet","Matchstick Pattern Worksheet","Download and print the LKPD.",2],["game","Matchstick Pattern Detectives","The game that helps you complete the worksheet.",3]].map(x=>`<a class="card${x[0]=="game"?" feat":""}" style="--c:${COL[x[3]]}" href="#/${x[0]}"><span class="ic">${IC[x[0]]}</span><span class="mt"><h2>${x[1]}</h2>${x[2]}</span><span class="go">→</span></a>`).join("")}</div></div>`,
objectives:()=>tb("Learning Objectives","menu")+`<div class="wrap"><div class="card" style="--c:${COL[0]}"><h2>By the end of the lesson, I can …</h2><ol>${OBJ.map(o=>`<li>${o}</li>`).join("")}</ol></div><div class="card" style="--c:${COL[1]}"><h2>How I know I can do it</h2><ul><li>I can say how many objects are added from one figure to the next.</li><li>I can complete a table for the first five figures and explain the next ones.</li><li>I can write Uₙ and check it by putting in n.</li><li>I can use Uₙ to answer a real-life question and explain my answer in English.</li></ul></div></div>`,
materials:()=>tb("Materials","menu")+`<div class="wrap"><div class="card" style="--c:${COL[0]}"><h2>What is a pattern?</h2>A <b>pattern</b> is a regular arrangement of objects or numbers that follows a rule. In a pattern of objects, each picture is a <b>figure</b>: Figure 1, Figure 2, Figure 3, …</div>
<div class="card" style="--c:${COL[1]}"><h2>Example 1: triangles</h2>${[1,2,3].map(n=>fig("t",n,{nw:1})).join("")}<p>Matchsticks: <b>3, 5, 7, …</b> The orange sticks are new. The <b>difference</b> is 2.</p></div>
<div class="card" style="--c:${COL[3]}"><h2>Example 2: squares</h2>${[1,2,3].map(n=>fig("s",n,{nw:1})).join("")}<p>Matchsticks: <b>4, 7, 10, …</b> The difference is 3.</p></div>
<div class="card" style="--c:${COL[2]}"><h2>The formula for the n-th figure</h2><p>Uₙ = (difference) × n + (U₁ − difference)</p><div class="bx">Triangles: b = 2, so Uₙ = 2n + (3 − 2) = <b>2n + 1</b><br>Check: U₃ = 2(3) + 1 = 7 ✓ &nbsp; U₁₀₀ = 2(100) + 1 = <b>201</b><br><br>Squares: b = 3, so Uₙ = 3n + (4 − 3) = <b>3n + 1</b><br>Check: U₁₀ = 3(10) + 1 = <b>31</b></div>
<table style="--c:${COL[2]}"><tr><th>Figure (n)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>10</th><th>100</th></tr><tr><td>2n + 1</td><td>3</td><td>5</td><td>7</td><td>9</td><td>11</td><td>21</td><td>201</td></tr><tr><td>3n + 1</td><td>4</td><td>7</td><td>10</td><td>13</td><td>16</td><td>31</td><td>301</td></tr></table></div>
<div class="card" style="--c:${COL[4]}"><h2>Detective steps</h2><span class="chip">1 Look</span><span class="chip">2 Count</span><span class="chip">3 Compare</span><span class="chip">4 Predict</span><span class="chip">5 Generalize</span></div>
<div class="card" style="--c:${COL[1]}"><h2>Key Words</h2>${KW.map(k=>`<div><b>${k[0]}</b>: ${k[1]}</div>`).join("")}<h3>Sentence frames</h3><div class="bx">I know that … / I need to find …<br>Each time we add … matchsticks, so Figure … has …<br>The rule is … / The formula is Uₙ = …<br>We checked with n = …, and it works.<br>So, the answer is …</div></div></div>`,
worksheet:()=>tb("Matchstick Pattern Worksheet","menu")+`<div class="wrap"><div class="card" style="--c:${COL[2]}"><h2>Matchstick Pattern Worksheet (LKPD)</h2><p>Your teacher prints this worksheet for each group. You can also download it here. Write your final answers on the worksheet.</p><p><a class="btn" href="Matchstick_Pattern_Worksheet.pdf" download>Download PDF</a> &nbsp; <a class="btn g s" href="Matchstick_Pattern_Worksheet.pdf" target="_blank" rel="noopener">Open and print</a></p></div>
<div class="card" style="--c:${COL[0]}"><h2>What is inside</h2><div><span class="chip" style="background:#FDEBD6">A Look and Count</span><span class="chip" style="background:#DDF2EF">B Compare and Predict</span><span class="chip" style="background:#ECE6F6">C Generalize</span><span class="chip" style="background:#FCE3DE">D A New Pattern</span><span class="chip" style="background:#DFEBFC">E The Hall</span></div><p>Each part matches a station in the game.</p><a class="btn s" href="#/game">Open the game</a></div></div>`};
/* ---------- game ---------- */
const ST=[["Look and Count","Sharp Eyes","t"],["Compare and Predict","Prediction Pro","t"],["Generalize","Formula Finder","t"],["A New Pattern: Squares","Pattern Master","s"],["Real-Life Problem: The Hall","Hall Hero","t"]];
const Q=[
[["Figure 1 has __ matchsticks, Figure 2 has __, and Figure 3 has __.",[3,5,7],"Count every matchstick. Tap the dotted places to build each figure.","Triangles that touch share a matchstick.","Figure 1: 3. Figure 2: 3 + 2 = 5. Figure 3: 5 + 2 = 7."]],
[["How many matchsticks are added? From Figure 1 to 2: +__ From Figure 2 to 3: +__",[2,2],"Switch on “Show what is new”. How many orange sticks?","Count only the orange ones.","Figure 1 → 2: 2 new sticks. Figure 2 → 3: 2 new sticks."],["Predict! Figure 4 has __ matchsticks and Figure 5 has __ matchsticks.",[9,11],"Add the new matchsticks to Figure 3, which has 7.","Figure 4 = Figure 3 + ?","7 + 2 = 9, then 9 + 2 = 11."]],
[["Find a rule for any figure n! Uₙ = __ × n + __",[2,1],"How many matchsticks are added each time? That number goes in front of n.","Figure 1 has 3 matchsticks: 2 × 1 + ? = 3.","Uₙ = 2 × n + 1"],["Test your formula! n = 1 gives __, n = 2 gives __, n = 3 gives __.",[3,5,7],"Put n into 2 × n + 1.","For n = 1: 2 × 1 + 1 = ?","2(1) + 1 = 3, 2(2) + 1 = 5, 2(3) + 1 = 7. It works!"],["How many matchsticks do we need for Figure 100? U₁₀₀ = __",[201],"Put n = 100 into your formula.","2 × 100 = 200, then add 1.","2 × 100 + 1 = 201."]],
[["Squares in a row. Figure 1 has 4 matchsticks. Figure 2 has __, Figure 3 has __, Figure 4 has __, Figure 5 has __.",[7,10,13,16],"4 sticks for the first square, then add more for each new square.","Count the orange sticks: how many does each new square need?","4, 7, 10, 13, 16 (+3 each time)."],["The formula is Uₙ = __ × n + __",[3,1],"The number in front of n is the difference.","Figure 1 has 4 matchsticks: 3 × 1 + ? = 4.","Uₙ = 3 × n + 1"],["How many matchsticks for Figure 10? U₁₀ = __",[31],"Put n = 10 into your formula.","3 × 10 = 30, then add 1.","3 × 10 + 1 = 31."],["Triangles add 2 each time. Squares add 3. Which pattern grows faster, and why?",[0],"Which pattern adds more matchsticks each time?","Compare 2 and 3.","Squares: 3 matchsticks are added each time (triangles: 2).",["Squares, because 3 matchsticks are added each time","Triangles, because they have fewer sides","Both grow the same"]]],
[["Hall chairs: Row 1 = 5, Row 2 = 7, Row 3 = 9. 2 chairs are added each row. Uₙ = __ × n + __",[2,3],"Row 1 has 5 chairs: 2 × 1 + ? = 5.","The number you add is 3.","Uₙ = 2 × n + 3"],["How many chairs are in Row 20? U₂₀ = __",[43],"Put n = 20 into your formula.","2 × 20 = 40, then add 3.","2 × 20 + 3 = 43."],["Which row has exactly 25 chairs? 2n + 3 = 25, so 2n = __ and n = __",[22,11],"Subtract 3 from both sides.","Divide both sides by 2.","2n = 22, n = 11. Row 11 has exactly 25 chairs."]]];
const G={st:0,qi:0,done:[],tr:0,ok:{},fn:1,pl:new Set,nw:0,r:3,pk:-1};
function board(){const s=G.st,k=ST[s][2],c=COL[s];
if(s==0||s==3)return`<div class="tabs" style="--c:${c}">${[1,2,3].map(n=>`<button class="${G.fn==n?"on":""}" data-a="fn" data-i="${n}">Figure ${n}</button>`).join("")}</div><p style="margin:4px 0">Tap the dotted places to put matchsticks.</p>${fig(k,G.fn,{pl:G.pl,lab:"Figure "+G.fn})}<div><span class="cnt" style="--c:${c}">Matchsticks: ${G.pl.size}</span> <button class="btn g s" data-a="clr">Clear</button></div>`;
if(s==1)return[1,2,3].map(n=>fig("t",n,{nw:G.nw})).join("")+`<p><button class="btn s" data-a="nw">Show what is new</button></p>`+((G.ok[1]||0)>1?[4,5].map(n=>fig("t",n,{nw:1,c:2*n+1})).join(""):"");
if(s==2){const ok=(G.ok[2]||0)>0,r=n=>ok||n<3?[n,2*n,2*n+1,1]:[n,"?","?","?"];return`<table style="--c:${c}"><tr><th>n</th><th>2 × n</th><th>Uₙ</th><th>Uₙ − 2n</th></tr>${[1,2,3,4,5].map(n=>"<tr>"+r(n).map(v=>`<td>${v}</td>`).join("")+"</tr>").join("")}</table>`}
if(s==4)return chairs(G.r)+`<p><button class="btn s" data-a="ar">+ Add Row</button> <button class="btn g s" data-a="rr">− Remove Row</button></p>`;
return""}
function station(){const s=G.st,q=Q[s][G.qi],c=COL[s];let n=0;const t=q[0].replace(/__/g,()=>q[5]?"":`<input class="ai" inputmode="numeric" data-n="${n++}">`);
return tb("Station "+"ABCDE"[s]+": "+ST[s][0],"game")+`<div class="wrap st" style="--c:${c}"><div class="card" style="--c:${c}">${board()}</div><div class="card" style="--c:${c}"><div class="pr">${Q[s].map((_,i)=>`<i class="${i<G.qi?"d":i==G.qi?"c":""}"></i>`).join("")}</div><p class="q">${t}</p>${q[5]?q[5].map((o,i)=>`<button class="mc ${G.pk==i?"on":""}" data-a="pk" data-i="${i}">${o}</button>`).join(""):""}<button class="btn" data-a="ck">Check</button><button class="btn g s" data-a="hn">Hint</button><div class="fb" id="fb"></div></div></div>`}
function gamePage(){return tb("Matchstick Pattern Detectives","menu")+`<div class="wrap"><div class="card" style="--c:${COL[0]}"><h2>Matchstick Pattern Detectives</h2>Choose a station. Each station matches a part of your worksheet. Work as a group on one smartphone, and write your final answers on the worksheet.<div class="bx">Detective steps: Look → Count → Compare → Predict → Generalize.<br>Roles: Builder builds, Recorder writes, Checker checks the numbers, Speaker explains. Swap roles in Part B and D!</div></div><div class="grid">${ST.map((x,i)=>`<a class="card" style="--c:${COL[i]}" href="#/game/${"ABCDE"[i]}"><span class="stl">${"ABCDE"[i]}</span><span class="mt stx"><h2>${x[0]}</h2><small>Worksheet Part ${"ABCDE"[i]}</small></span><span class="stb${G.done.includes(i)?" d":""}">${G.done.includes(i)?"Done · "+x[1]:"Play"}</span></a>`).join("")}</div>${G.done.length==5?`<div class="card" style="--c:${COL[1]}"><h2>Mission complete!</h2>Big ideas: 1) Find what is added each time. 2) Use it to predict the next figures. 3) Write the formula Uₙ to find any figure.<br><b>Next: our Kahoot quiz!</b> Your teacher will show the code.</div>`:""}</div>`}
/* ---------- router ---------- */
function route(){let h=location.hash.replace(/^#\/?/,"")||"home";const[a,b]=h.split("/");
if(a=="game"&&b){const i="ABCDE".indexOf(b.toUpperCase());if(i<0){location.hash="#/game";return}if(G.st!=i||!G.started){Object.assign(G,{st:i,qi:0,tr:0,fn:1,pl:new Set,nw:0,r:3,pk:-1,started:1})}G.cur=i;app.innerHTML=station();scrollTo(0,0);return}
G.started=0;app.innerHTML=a=="game"?gamePage():(P[a]||P.home)();scrollTo(0,0)}
function fb(c,m,x){const e=$("#fb");e.className="fb "+c;e.innerHTML=m+(x||"")}
function redraw(){$(".card").innerHTML=board()}
function pass(w){G.ok[G.st]=(G.ok[G.st]||0)+1;G.tr=0;const last=G.qi==Q[G.st].length-1;if(last&&!G.done.includes(G.st))G.done.push(G.st);redraw();
fb("ok",(w?w:"Great detective work!")+(last?" Badge earned: "+ST[G.st][1]:""),`<br><button class="btn s" style="margin-top:8px" data-a="${last?"back":"nx"}">${last?(G.st<4?"Back to stations":"Finish"):"Next →"}</button>`)}
const act={
fn(e){G.fn=+e.dataset.i;G.pl=new Set;app.innerHTML=station()},clr(){G.pl=new Set;redraw()},
nw(){G.nw=!G.nw;redraw()},ar(){G.r=Math.min(5,G.r+1);redraw()},rr(){G.r=Math.max(2,G.r-1);redraw()},
pk(e){G.pk=+e.dataset.i;document.querySelectorAll(".mc").forEach((b,i)=>b.classList.toggle("on",i==G.pk))},
nx(){G.qi++;G.tr=0;G.pk=-1;app.innerHTML=station()},back(){location.hash="#/game"},
hn(){const q=Q[G.st][G.qi];fb("h",q[2+Math.min(G.tr,1)])},
ck(){const q=Q[G.st][G.qi];let ok;if(q[5])ok=G.pk==q[1][0];else{const v=[...document.querySelectorAll(".ai")].map(i=>i.value.trim());ok=v.length==q[1].length&&v.every((x,i)=>x!==""&&Number(x)==q[1][i])}
if(ok)return pass();G.tr++;if(G.tr<3)return fb("no","Not yet. Try again! "+q[2+G.tr-1]);fb("no","Not yet. Try again!",'<br><button class="btn g s" style="margin-top:8px" data-a="sh">Show me how</button>')},
sh(){pass(Q[G.st][G.qi][4])}};
document.addEventListener("click",e=>{const l=e.target.closest("line.sl");if(l){const k=l.dataset.k;G.pl.has(k)?G.pl.delete(k):G.pl.add(k);redraw();return}
const b=e.target.closest("[data-a]");if(b&&act[b.dataset.a])act[b.dataset.a](b)});
addEventListener("hashchange",route);route();
</script></body></html>
